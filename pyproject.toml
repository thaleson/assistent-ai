[project]
name = "raissa-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
